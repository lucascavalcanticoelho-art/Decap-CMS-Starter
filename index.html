<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo Digital</title>
  </head>
  <body>
    <h1>Catálogo Digital</h1>
    <!-- Seu conteúdo da home aqui -->

    <!-- Netlify Identity na HOME, apenas para tratar o invite_token -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      // Se o link do convite abrir na home (/#invite_token=...), manda o hash para /admin
      if (location.hash && location.hash.includes('invite_token=')) {
        location.replace('/admin/' + location.hash);
      }
    </script>
  </body>
</html>
