<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS</title>
  </head>
  <body>
    <!-- Widget de Identity (necessário para processar invite_token) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Se vier com #invite_token=..., aceita o convite e volta para /admin -->
    <script>
      (function () {
        if (window.location.hash && window.location.hash.includes('invite_token=')) {
          var token = window.location.hash.split('invite_token=')[1];
          if (token && window.netlifyIdentity) {
            window.netlifyIdentity.acceptInvite(token, true)
              .then(function () { window.location.replace('/admin/'); })
              .catch(function (e) { console.error('Invite error', e); alert('Falha ao confirmar o convite.'); });
          }
        }
      })();
    </script>

    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@latest/dist/decap-cms.js"></script>
  </body>
</html>
